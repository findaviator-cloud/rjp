<style>

*{box-sizing:border-box}

#bearBox{height:58vh;display:none}

#dots i.on{background:#43a047;border-color:#2e7d32}
#nm{position:fixed;top:2vmin;right:3vmin;font-size:4vmin;font-weight:800;opacity:.8}
#menuBtn{position:fixed;top:2vmin;left:3vmin;font-size:3.4vmin;font-weight:700;background:rgba(255,255,255,.6);border:0;border-radius:2vmin;padding:1vmin 2.4vmin;color:#3e2723}

@keyframes fl{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-55vh) scale(1.2);opacity:0}}
#pz{position:fixed;inset:0;background:rgba(0,0,0,.45);color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:7vmin;font-weight:800;text-align:center;padding:4vmin}

const HUES=[['#ffe082','#ffab91'],['#b3e5fc','#c5e1a5'],['#f8bbd0','#ffe082'],['#c5cae9','#b2dfdb'],['#ffccbc','#fff59d'],['#dcedc8','#b3e5fc']];let hi=0;
function bg(){hi=(hi+1)%HUES.length;document.documentElement.style.setProperty('--bg1',HUES[hi][0]);document.documentElement.style.setProperty('--bg2',HUES[hi][1])}
function show(kind,pic,cap,sub){$('bearBox').style.display=kind==='bear'?'block':'none';const p=$('pic');p.style.display=kind==='pic'?'block':'none';if(kind==='pic'){p.textContent=pic;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
 $('cap').textContent=cap||'';$('sub').textContent=sub||'';dots(0)}
function dots(n,on){const d=$('dots');if(n>0&&d.children.length!==n){d.innerHTML='';for(let i=0;i<n;i++)d.appendChild(document.createElement('i'))}if(n===0)d.innerHTML='';if(on!=null)[...d.children].forEach((x,i)=>x.classList.toggle('on',i<on))}
function stars(){for(let i=0;i<9;i++){const s=document.createElement('div');s.className='star';s.textContent=i%3?'⭐':'🌟';s.style.left=(8+Math.random()*84)+'vw';s.style.top=(45+Math.random()*40)+'vh';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
async function respond(){bell(2);const n=RESP;dots(n,0);for(let i=1;i<=n;i++){await slp(1000);await ck();dots(n,i)}await slp(300);dots(0)}
async function cheer(keepPic){const p=MV.praise[Math.floor(Math.random()*MV.praise.length)];if(!keepPic)setPose('cheer');stars();await say(p);await slp(500);await ck()}
/* ---------- khel ---------- */
async function doAction(a){const [id,pose,cmd,mk,help]=a;show('bear','',cmd,help?MV.help:'');
 for(let r=0;r<3;r++){setPose(pose,mk);await say(r?MV.prompt.again:MV.prompt.look);await say(cmd);await slp(1800);await say(MV.prompt.you);await respond();await cheer()}}
async function doWord(w){const [em,wd]=w;show('pic',em,wd);
 for(let r=0;r<3;r++){await say(r?MV.prompt.again:MV.prompt.look);await say(wd);await say(MV.prompt.say);await say(wd);await respond();await cheer(true)}}
async function doSound(s){const [tx,sh]=s;show('bear','',tx);const pm={wide:'mwide',round:'mround',lips:'mlips',tongue:'mtongue'}[sh];
 for(let r=0;r<3;r++){setPose(pm);await say(r?MV.prompt.again:MV.prompt.listen);await say(tx);await slp(500);await say(MV.prompt.say);await respond();await cheer()}}
async function doAnimal(a){const [em,nm,sd]=a;show('pic',em,nm+' — '+sd);
 for(let r=0;r<2;r++){await say(r?MV.prompt.again:MV.prompt.look);await say(nm);await say(sd);await say(MV.prompt.say);await say(sd);await respond();await cheer(true)}}
async function doRide(){show('pic','🏍️','पीं पीं! बाइक चली!','');$('pic').style.animation='ride 1s ease-in-out infinite';bell(3);await say(MV.prompt.ride);await slp(2500);await ck();$('pic').style.animation=''}
const DO={A:doAction,W:doWord,S:doSound,N:doAnimal};
function nextOf(c){const L=P[c],i=IX[c]%L.length;IX[c]=(i+1)%L.length;save();return{c,d:L[i]}}
const AUTO='AWSANWAS';let autoI=0;
function pick(){return curMode==='auto'?nextOf(AUTO[autoI++%AUTO.length]):nextOf(curMode)}
async function doBreak(){show('pic','🌟',MV.brk[0].split('।')[0]+'!','');setPose('cheer');await play(MV.brk[0]);setPose('idle');paused=true;pauseT=Date.now();$('pzt').textContent='😊 अब थोड़ा खेलो';$('pzs').textContent='फिर खेलना हो तो OK दबाएँ';$('pz').style.display='flex';await ck()}
async function runLoop(){const my=++TOK;sessStart=Date.now();pauseAcc=0;doneItems=0;
 while(my===TOK&&!menuOpen){
  if(Date.now()-sessStart-pauseAcc>LIMIT){try{canc=false;await doBreak()}catch(e){if(my!==TOK)return}sessStart=Date.now();pauseAcc=0}
  let it;if(qi<queue.length)it=queue[qi];else{it=pick();queue.push(it)}
  canc=false;bg();lastItem=it;
  try{await DO[it.c](it.d);qi++;doneItems++;if(doneItems%3===0){canc=false;await doRide()}}catch(e){if(e!=='cancel')console.error(e);if(my!==TOK)return}
 }}
function start(m){curMode=m;queue=[];qi=0;menuOpen=false;paused=false;$('menu').style.display='none';$('pz').style.display='none';window.__started=1;canc=true;halt();setTimeout(()=>{canc=false;if(!menuOpen)runLoop()},40)}
function showMenu(){menuOpen=true;TOK++;canc=true;paused=false;halt();animFn=null;$('menu').style.display='flex';$('pz').style.display='none';const f=document.querySelector('.tile');if(f)f.focus()}
function skip(d){if(menuOpen)return;qi=Math.max(0,qi+(d>0?1:-1));if(d<0&&qi===queue.length-1&&false)qi=0;canc=true;if(paused)togglePause(true);halt()}
function togglePause(force){if(menuOpen)return;if(paused||force){if(pauseT)pauseAcc+=Date.now()-pauseT;paused=false;$('pz').style.display='none';if(pw){const f=pw;pw=null;f()}}else{paused=true;pauseT=Date.now();$('pzt').textContent='⏸ रुका है';$('pzs').textContent='चलाने के लिए OK दबाएँ';$('pz').style.display='flex'}}
/* ---------- menu / keys ---------- */
function respLabel(){$('respT').textContent='रुकना '+RESP+' सेकंड'}
document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.m;if(m==='resp'){RESP=RESP===4?6:RESP===6?9:4;save();respLabel();return}start(m)}));
$('menuBtn').addEventListener('click',showMenu);
$('stage').addEventListener('click',()=>togglePause());
$('pz').addEventListener('click',e=>{e.stopPropagation();togglePause()});
addEventListener('keydown',e=>{const k=e.key,c=e.keyCode;
 if(menuOpen){const ts=[...document.querySelectorAll('.tile')];let i=ts.indexOf(document.activeElement);if(i<0)i=0;if(k==='ArrowRight')i++;else if(k==='ArrowLeft')i--;else if(k==='ArrowDown')i+=3;else if(k==='ArrowUp')i-=3;else return;i=(i+ts.length)%ts.length;ts[i].focus();e.preventDefault();return}
 if(k==='Enter'||k===' '||c===23){togglePause();e.preventDefault()}else if(k==='ArrowRight'||c===22)skip(1);else if(k==='ArrowLeft'||c===21)skip(-1);else if(k==='Escape'||k==='Backspace'||k==='GoBack'||c===4){showMenu();e.preventDefault()}});
respLabel();requestAnimationFrame(frame);setPose('idle');$('menu').querySelector('.tile').focus();
window.__mv={get items(){return doneItems},get last(){return lastItem},get queue(){return queue},get paused(){return paused},get menu(){return menuOpen},start,skip,showMenu,togglePause};
</script></body></html>
